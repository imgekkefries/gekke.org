      image-rendering: pixelated;
    }

    body {

      color: var(--ink);

      filter: contrast(1.06) saturate(0.92) brightness(0.96);

    .h {
      position: fixed;
      top: 50%;
      width: var(--hw);
      height: auto;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
      filter: grayscale(1) contrast(1.9) brightness(1.1);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
      z-index: 2;
      pointer-events: none;
      opacity: 0;

    .hl {
      left: 0;
      transform: translateY(-50%) translateX(-100vw);
    }

    .hr {
      right: 0;
      transform: translateY(-50%) translateX(100vw);
    }

    body.rdy .h {
      opacity: 1;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
    }

    body.rdy .hl {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rxl, 0px));
    }

    body.rdy .hr {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rxr, 0px));
    }

    body.rdy.tch .hl {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--txl, 0px));
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    body.rdy.tch .hr {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--txr, 0px));
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body.sqa .hl {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rxl, 0px)) !important;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    body.sqa .hr {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(var(--rxr, 0px)) !important;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    body.hxe .hl {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(-110vw) !important;
      opacity: 0 !important;
      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    body.hxe .hr {
      transform: translateY(calc(-50% + var(--dy, 0px))) translateX(110vw) !important;

      transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1),

    #ch {

      top: 50%;

    #rs .ic {

    .pe {

      max-height: 60vh;

      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.25) transparent;
      -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 12px,
        #000 calc(100% - 12px),
        transparent 100%);
              mask-image: linear-gradient(to bottom,
        transparent 0,
        #000 12px,
        #000 calc(100% - 12px),
        transparent 100%);

    .pe::-webkit-scrollbar {
      width: 4px;
    }
    .pe::-webkit-scrollbar-track {
      background: transparent;
    }
    .pe::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22);

    .se {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      filter: grayscale(1) contrast(1.35) brightness(0.9);
      transition: filter 0.25s ease,

    body.uv #pc .se {

    body.uv #pc .se:nth-child(1) { transition-delay: 0.15s, 0.15s, 0.15s; }
    body.uv #pc .se:nth-child(2) { transition-delay: 0.30s, 0.30s, 0.30s; }
    body.uv #pc .se:nth-child(3) { transition-delay: 0.45s, 0.45s, 0.45s; }
    body.uv #pc .se:nth-child(4) { transition-delay: 0.60s, 0.60s, 0.60s; }

    #pl li::after {
      content: "";

      left: 0;
      bottom: -0.18em;
      height: 1.5px;
      width: 100%;
      background: #ffffff;
      clip-path: inset(0 100% 0 0);

    #pl li.sl:hover::after {

    #sl li a,

      color: #ffffff;
      text-decoration: none;
      display: inline-block;

    #sl li a::after,

      position: absolute;
      left: 0;
      bottom: -0.18em;
      height: 1.5px;

      background: #ffffff;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;

    #sl li a:hover::after,

    .il li .c {

      background: #ffffff;
      margin-left: 0.15em;

    @keyframes bk {

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9996;
      pointer-events: none;

    #ts {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      opacity: 0.10;
      overflow: hidden;
      background-image:
        radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.6) 0.5px, transparent 0.6px),
        radial-gradient(rgba(200,200,200,0.5) 0.5px, transparent 0.6px);
      background-size: 3px 3px, 5px 5px, 7px 7px;
      background-position: 0 0, 1px 2px, 3px 1px;
      will-change: background-position, opacity;
    }

    #co {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.10) 0px,
          rgba(0, 0, 0, 0.10) 1px,
          rgba(0, 0, 0, 0.00) 1px,
          rgba(0, 0, 0, 0.00) 3px
        ),
        repeating-linear-gradient(
          to right,
          rgba(255, 0, 0, 0.015) 0px,
          rgba(255, 0, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 3px
        );
      mix-blend-mode: multiply;
      animation: cf 0.18s infinite steps(2);
    }

    @keyframes cf {
      0%   { opacity: 0.98; }
      50%  { opacity: 1.00; }
      100% { opacity: 0.98; }
    }

    @media (max-width: 768px) {
      .hb {
        padding: 0.4em 0.7em;
      }
      .ht {
        font-size: 20px;
      }

      #pc { display: none !important; }

      #rs {
        left: auto;
        right: 4vw;
        text-align: right;
      }
      #rs .fi { gap: 2.2em; }
      #rs .ic { text-align: right; }
      #pl li::after,
      #sl li a::after,
      #sl li span.ml::after {
        left: auto; right: 0;
      }
      .ch2 { text-align: right; }
      #pl li,
      #sl li { text-align: right; }

      .il li {
        font-size: 17px;
        letter-spacing: 0.06em;
        margin: 0.85em 0;
        line-height: 1.45;
      }
      .ch2 {
        font-size: 14px;
        letter-spacing: 0.22em;
        margin-bottom: 0.9em;
      }
    }

    @media (max-width: 420px) {
      .il li {
        font-size: 15px;
        margin: 0.7em 0;
      }
      .ch2 {
        font-size: 13px;
        margin-bottom: 0.7em;
      }
      #rs .fi { gap: 1.8em; }
    }
  </style>

  <script>
    (function () {
      const li = document.querySelector('.hl');
      const ri = document.querySelector('.hr');
      const te = document.querySelector('.tt');
      const st = document.getElementById('stl');
      const hi = document.getElementById('hi');
      const hw = document.getElementById('hw');
      const pc = document.getElementById('pc');
      const rs = document.getElementById('rs');
      const pl = document.getElementById('pl');
      const sl = document.getElementById('sl');

      const mob = () => window.matchMedia('(max-width: 768px)').matches;

      let sq = false;

      const TXT = 'gekkefries';
      let sc = [];

      function bt() {
        if (!st) return;
        st.innerHTML = '';
        sc = [];
        for (let i = 0; i < TXT.length; i++) {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = TXT[i];
          st.appendChild(s);
          sc.push(s);
        }
        aa();
      }

      function aa() {
        if (!st || !sc.length) return;
        const n = sc.length;
        if (n < 2) return;

        const f = parseFloat(getComputedStyle(st).fontSize) || 120;
        const d = f * 0.10;

        for (let i = 0; i < n; i++) {
          const t = (i / (n - 1)) * 2 - 1;
          const l = d * (t * t);
          sc[i].style.transform = `translateY(${l - d * 0.5}px)`;
        }
      }

      function rh() {
        [li, ri].forEach((x) => {
          if (x) x.removeAttribute('src');
        });
      }
      window.addEventListener('pagehide', rh);
      window.addEventListener('beforeunload', rh);
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) location.reload();
      });

      function lh(img, src, a) {
        a = a || 0;
        return new Promise((res) => {
          let s = false;

          function cl() {
            img.removeEventListener('load', ol);
            img.removeEventListener('error', of);
          }
          function fi(ok) {
            if (s) return;
            s = true;
            cl();
            res(ok);
          }
          function rt() {
            if (s) return;
            s = true;
            cl();
            if (a >= 4) { res(false); return; }
            img.removeAttribute('src');
            setTimeout(() => {
              lh(img, src + '?r=' + Date.now() + '_' + a, a + 1)
                .then(res);
            }, 250 * (a + 1));
          }
          function of() { rt(); }
          function ol() {
            if (!img.naturalWidth) { rt(); return; }
            if (typeof img.decode === 'function') {
              img.decode().then(() => {
                if (img.naturalWidth) fi(true); else rt();
              }).catch(rt);
            } else {
              fi(true);
            }
          }

          img.addEventListener('load', ol);
          img.addEventListener('error', of);
          img.src = src;
          if (img.complete && img.naturalWidth) ol();
        });
      }

      function fs() {
        const es = document.querySelectorAll('.se');
        if (!es.length) return;
        const m = mob();

        es.forEach((e) => {
          const f = e.querySelector('iframe');
          if (!f) return;
          e.style.height = '';
          f.style.position = '';
          f.style.top = '';
          f.style.left = '';
          f.style.transform = '';
          f.style.transformOrigin = '';
          f.style.width = '';
          f.style.height = '';
          if (!m) f.style.height = '80px';
        });
      }

      const U = {
        tx: 592,
        ty: 0,
        lx: 344,
        rx: 778,
      };

      const UT = 26;

      function cu() {
        if (!hi || !hi.naturalWidth) return null;

        const nw = hi.naturalWidth;
        const nh = hi.naturalHeight;
        if (!nw || !nh) return null;

        const H = window.innerHeight;
        const W = window.innerWidth;

        const tp = H * (UT / 100);
        const rh2 = Math.max(1, H - tp);
        const s = rh2 / nh;
        const rw = nw * s;

        const hc = (U.lx + U.rx) / 2;
        const hr = hc * s;

        const wc = W / 2;
        const il = wc - rw / 2;
        const hi2 = il + hr;
        const sx = wc - hi2;

        const hl = il + U.lx * s + sx;
        const hr2 = il + U.rx * s + sx;

        return {
          nw, nh, s, rw, rh: rh2, sx,
          hl, hr: hr2,
          tp
        };
      }

      function fu() {
        if (!hi) return;
        const l = cu();
        if (!l) { fc(null); return; }

        hi.style.height = l.rh + 'px';
        hi.style.width  = l.rw + 'px';

        hw.style.transform = '';
        hw.style.left = '50%';
        hw.style.setProperty('--usx', l.sx + 'px');

        fc(l);
      }

      function fcl(o, nw, aw, mz, zt, zh) {
        const i = o.querySelector('.fi');
        if (!i) return;
        i.style.zoom = 1;
        i.style.width = nw + 'px';
        const nh = i.offsetHeight || 1;
        let z = Math.min(mz, aw / nw, zh / nh);
        if (!isFinite(z)) z = 1;
        z = Math.max(0.3, z);
        i.style.zoom = z;
        const h = nh * z;
        o.style.top = (zt + Math.max(0, (zh - h) / 2)) + 'px';
        o.style.transform = 'none';
      }

      function fc(l) {
        const W = window.innerWidth;
        const H = window.innerHeight;
        const m = mob();
        if (!m && !l) return;

        const tb = st ? st.getBoundingClientRect().bottom : 0;
        const gv = Math.max(8, H * 0.02);
        const zt = Math.min(tb + gv, H * 0.7);
        const zb = H - Math.max(10, H * 0.03);
        const zh = Math.max(60, zb - zt);
        const sm = Math.max(10, W * 0.02);

        if (m) {
          if (rs) {
            const nw = W * (W <= 420 ? 0.62 : 0.6);
            fcl(rs, nw, W * 0.92, 1, zt, zh);
            rs.style.left = '';
          }
          if (pc) pc.style.right = '';
          return;
        }

        const G = Math.max(12, W * 0.02);
        const hll = l.hl;
        const hrr = l.hr;

        if (pc) {
          const aw = hll - G - sm;
          fcl(pc, 300, aw, 1.5, zt, zh);
          pc.style.right = (W - (hll - G)) + 'px';
        }
        if (rs) {
          const aw = W - (hrr + G) - sm;
          fcl(rs, 280, aw, 1.5, zt, zh);
          rs.style.left = (hrr + G) + 'px';
        }
      }

      if (sl) {
        const ms = sl.querySelector('.ml');
        if (ms) {
          ms.addEventListener('click', function (e) {
            e.preventDefault();
            const m = this.getAttribute('data-mail') || 'gekkefries@proton.me';
            navigator.clipboard.writeText(m).then(() => {
              const ot = this.textContent;
              this.textContent = 'COPIED!';
              setTimeout(() => { this.textContent = ot; }, 1200);
            }).catch(() => {
              const ta = document.createElement('textarea');
              ta.value = m;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              const ot = this.textContent;
              this.textContent = 'COPIED!';
              setTimeout(() => { this.textContent = ot; }, 1200);
            });
          });
        }
      }

      function fg() {
        const W = window.innerWidth;
        const rg = getComputedStyle(document.documentElement).getPropertyValue('--rg').trim();
        const rs2 = getComputedStyle(document.documentElement).getPropertyValue('--rs').trim();
        const gp = W * (parseFloat(rg) / 100);
        const sp = W * (parseFloat(rs2) / 100);
        return gp + sp;
      }

      function ct() {
        if (!te) return;
        const W = window.innerWidth;
        const rs2 = getComputedStyle(document.documentElement).getPropertyValue('--rs').trim();
        const sp = W * (parseFloat(rs2) / 100);
        te.style.setProperty('--tdx', (sp / 2) + 'px');
      }

      function ft() {
        if (!te) return;
        ct();
        const W = window.innerWidth;
        const H = window.innerHeight;
        const gp = fg();
        const aw = Math.max(gp, W * 0.3) * 0.82;
        const ah = H * 0.22;
        const R = 100;
        const pi = te.style.fontSize;
        te.style.fontSize = R + 'px';
        const rc = te.getBoundingClientRect();
        const nw = rc.width;
        const nh = rc.height;
        if (!nw || !nh) {
          te.style.fontSize = pi;
          return;
        }
        const sw = aw / nw;
        const sh = ah / nh;
        const s = Math.min(sw, sh);
        let fs2 = R * s;
        fs2 = Math.max(14, Math.min(fs2, 110));
        te.style.fontSize = fs2 + 'px';
      }

      function rdy(img, cb) {
        if (img.complete && img.naturalWidth) cb();
        else img.addEventListener('load', cb, { once: true });
      }

      function rh2() {
        const W = window.innerWidth;
        const lh2 = li.getBoundingClientRect();
        const rh3 = ri.getBoundingClientRect();
        if (!lh2.width || !rh3.width) return false;
        const nwl = li.naturalWidth;
        const nwr = ri.naturalWidth;
        if (!nwl || !nwr) return false;
        const LTX = 2150, LTY = 281;
        const RTX = 3,    RTY = 493;
        const sl2 = lh2.width / nwl;
        const sr2 = rh3.width / nwr;
        const ltx = LTX * sl2;
        const lty = LTY * sl2;
        const rtx = RTX * sr2;
        const rty = RTY * sr2;
        const lco = lty - lh2.height / 2;
        const rco = rty - rh3.height / 2;
        const to = (lco + rco) / 2;
        const ldy  = to - lco;
        const rdy2 = to - rco;
        const rg = getComputedStyle(document.documentElement).getPropertyValue('--rg').trim();
        const rs3 = getComputedStyle(document.documentElement).getPropertyValue('--rs').trim();
        const gp = W * (parseFloat(rg) / 100);
        const sp = W * (parseFloat(rs3) / 100);
        const lrx = (W / 2) - (gp / 2) - ltx;
        const rrx = (W / 2) + (gp / 2) + sp - ((W - rh3.width) + rtx);
        const ltx2  = (W / 2) - ltx;
        const rtx2 = (W / 2) - ((W - rh3.width) + rtx);
        li.style.setProperty('--dy', ldy + 'px');
        ri.style.setProperty('--dy', rdy2 + 'px');
        li.style.setProperty('--rxl', lrx + 'px');
        ri.style.setProperty('--rxr', rrx + 'px');
        li.style.setProperty('--txl', ltx2 + 'px');
        ri.style.setProperty('--txr', rtx2 + 'px');
        return true;
      }

      function up() {
        ft();
        fu();
        fs();
        aa();
        if (li.style.display === 'none') return;
        const ok = rh2();
        if (ok && !document.body.classList.contains('rdy')) {
          setTimeout(() => {
            document.body.classList.add('rdy');
          }, 50);
        }
      }

      let rf = false;
      function su() {
        if (rf) return;
        rf = true;
        requestAnimationFrame(() => {
          rf = false;
          up();
        });
      }

      bt();
      ft();

      (async function lb() {
        await lh(li, li.getAttribute('data-src'));
        await lh(ri, ri.getAttribute('data-src'));
        requestAnimationFrame(up);
      })();

      rdy(hi, () => { fu(); });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(su);
      }

      window.addEventListener('resize', su);
      window.addEventListener('orientationchange', su);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', su);
        window.visualViewport.addEventListener('scroll', su);
      }

      function tl(le, { selectable } = {}) {
        return new Promise((res) => {
          const it = Array.from(le.querySelectorAll('li'));
          function ti(i) {
            if (i >= it.length) { res(); return; }
            const l = it[i];
            const t = l.getAttribute('data-label') || '';
            l.classList.add('tp');
            if (le.id === 'sl') { ti(i+1); return; }
            l.textContent = '';
            const c = document.createElement('span');
            c.className = 'c';
            l.appendChild(c);
            let idx = 0;
            const sp = 24;
            function stp() {
              if (idx < t.length) {
                c.insertAdjacentText('beforebegin', t.charAt(idx));
                idx++;
                setTimeout(stp, sp);
              } else {
                c.remove();
                if (selectable) l.classList.add('sl');
                setTimeout(() => ti(i + 1), 120);
              }
            }
            stp();
          }
          ti(0);
        });
      }

      function ta() {
        tl(pl, { selectable: true }).then(() => {
          pl.querySelectorAll('li.sl').forEach((l) => {
            l.addEventListener('click', () => {
              console.log('Project clicked:', l.textContent.trim());
            });
          });
          const si = sl.querySelectorAll('li');
          si.forEach((l, i) => {
            setTimeout(() => { l.classList.add('tp'); }, i * 100);
          });
        });
      }

      document.body.addEventListener('click', function () {
        if (!document.body.classList.contains('rdy') || sq) return;
        sq = true;
        document.body.classList.add('hc');
        document.body.classList.add('tch');

        setTimeout(() => { document.body.classList.add('sg'); }, 400);

        setTimeout(() => {
          document.body.classList.remove('tch');
          document.body.classList.add('sqa');
          document.body.classList.add('ss');
          setTimeout(() => {
            document.body.classList.add('st');
            document.body.classList.add('sf');
          }, 300);
        }, 1000);

        setTimeout(() => {
          document.body.classList.add('hxe');
          setTimeout(() => {
            li.removeAttribute('src');
            ri.removeAttribute('src');
            li.style.display = 'none';
            ri.style.display = 'none';
          }, 1200);

          setTimeout(() => {
            document.body.classList.add('hv');
            fu();
            fs();
            aa();

            setTimeout(() => {
              document.body.classList.add('uv');
              ta();
            }, 900);
          }, 900);
        }, 2800);
      });
    })();

    (function () {
      const se = document.getElementById('ts');
      function tk() {
        const ox = (Math.random() * 10 - 5).toFixed(1);
        const oy = (Math.random() * 10 - 5).toFixed(1);
        se.style.backgroundPosition =
          ox + 'px ' + oy + 'px, ' +
          (Math.random() * 6).toFixed(1) + 'px ' + (Math.random() * 6).toFixed(1) + 'px, ' +
          (Math.random() * 8).toFixed(1) + 'px ' + (Math.random() * 8).toFixed(1) + 'px';
        se.style.opacity = (0.08 + Math.random() * 0.05).toFixed(3);
        requestAnimationFrame(tk);
      }
      tk();
    })();
  </script>
</body>
