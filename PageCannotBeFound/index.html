<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="author" content="gekkefries">
  <title>Page Cannot Be Found ~ gekke.org</title>

  <link rel="icon" type="image/png" href="https://imgekkefries.pythonanywhere.com/images/logo.png?v=1">
  <link rel="shortcut icon" type="image/png" href="https://imgekkefries.pythonanywhere.com/images/logo.png?v=1">
  <link rel="apple-touch-icon" href="https://imgekkefries.pythonanywhere.com/images/logo.png?v=1">

  <meta name="theme-color" content="#0a0d12">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'BlackRotting';
      src: url('BlackRotting.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --bg: #000000;
      --ink: #fafafa;
      --t1: #ffffff;
      --t2: rgba(255,255,255,0.92);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    html {
      background: #000000;
      image-rendering: pixelated;
    }

    body {
      background: #000000;
      color: var(--ink);
      position: fixed;
      inset: 0;
      cursor: pointer;
      filter: contrast(1.06) saturate(0.92) brightness(0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    .nf {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 64px;
      animation: fi 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      pointer-events: none;
    }

    @keyframes fi {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .num {
      font-family: 'Pirata One', serif;
      font-size: clamp(96px, 18vw, 200px);
      line-height: 1;
      letter-spacing: 0.04em;
      color: #ffffff;
      margin-bottom: 24px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .h {
      font-family: 'Pirata One', serif;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0.04em;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .p {
      font-family: 'Cormorant Garamond', 'Pirata One', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(16px, 2.2vw, 22px);
      line-height: 1.6;
      color: #ffffff;
      opacity: 0.85;
      letter-spacing: 0.05em;
      margin-bottom: 48px;
      text-shadow: 0 0 22px rgba(255,255,255,0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: gap 0.3s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      pointer-events: auto;
      opacity: 0.75;
      position: relative;
    }

    .btn:hover {
      gap: 20px;
      opacity: 1;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .btn:hover svg {
      transform: translateX(-4px);
    }

    .btn::after {
      content: "";
      position: absolute;
      left: 38px;
      right: 0;
      bottom: -6px;
      height: 1.5px;
      background: #ffffff;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .btn:hover::after {
      clip-path: inset(0 0 0 0);
    }

    @keyframes bk {
      0%, 50%   { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9996;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, rgba(255, 200, 130, 0.03) 0%, rgba(0, 0, 0, 0) 70%),
        rgba(90, 70, 40, 0.02);
      mix-blend-mode: screen;
    }

    #ts {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      opacity: 0.10;
      overflow: hidden;
      background-image:
        radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.6px),
        radial-gradient(rgba(255,255,255,0.6) 0.5px, transparent 0.6px),
        radial-gradient(rgba(200,200,200,0.5) 0.5px, transparent 0.6px);
      background-size: 3px 3px, 5px 5px, 7px 7px;
      background-position: 0 0, 1px 2px, 3px 1px;
      will-change: background-position, opacity;
    }

    #co {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.10) 0px,
          rgba(0, 0, 0, 0.10) 1px,
          rgba(0, 0, 0, 0.00) 1px,
          rgba(0, 0, 0, 0.00) 3px
        ),
        repeating-linear-gradient(
          to right,
          rgba(255, 0, 0, 0.015) 0px,
          rgba(255, 0, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 1px,
          rgba(0, 255, 0, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 2px,
          rgba(0, 0, 255, 0.015) 3px
        );
      mix-blend-mode: multiply;
      animation: cf 0.18s infinite steps(2);
    }

    @keyframes cf {
      0%   { opacity: 0.98; }
      50%  { opacity: 1.00; }
      100% { opacity: 0.98; }
    }

    @media (max-width: 750px) {
      .nf { padding: 40px; }
      .num { margin-bottom: 16px; }
      .h { margin-bottom: 14px; }
      .p { margin-bottom: 32px; }
      .btn { font-size: 12px; letter-spacing: 0.16em; }
      .btn::after { left: 34px; }
    }
  </style>
</head>
<body>
  <div class="nf">
    <div class="num">404</div>
    <div class="h">Page cannot be found</div>
    <div class="p">The page you're looking for doesn't exist or has been moved.</div>
    <button class="btn" id="b">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to home
    </button>
  </div>

  <div id="ts"></div>
  <div id="co"></div>

  <script>
    (function() {
      var b = document.getElementById('b');
      if (b) {
        b.addEventListener('click', function() {
          var u = window.location.href;
          var l = u.lastIndexOf('/');
          var x = u.substring(0, l);
          if (x.endsWith('/Templates')) x = x.substring(0, x.lastIndexOf('/'));
          if (!x.endsWith('/')) x += '/';
          window.location.href = x + 'index.html';
        });
      }
    })();
  </script>

  <script>
    (function () {
      const s = document.getElementById('ts');
      function t() {
        const ox = (Math.random() * 10 - 5).toFixed(1);
        const oy = (Math.random() * 10 - 5).toFixed(1);
        s.style.backgroundPosition =
          ox + 'px ' + oy + 'px, ' +
          (Math.random() * 6).toFixed(1) + 'px ' + (Math.random() * 6).toFixed(1) + 'px, ' +
          (Math.random() * 8).toFixed(1) + 'px ' + (Math.random() * 8).toFixed(1) + 'px';
        s.style.opacity = (0.08 + Math.random() * 0.05).toFixed(3);
        requestAnimationFrame(t);
      }
      t();
    })();
  </script>
</body>
</html>
