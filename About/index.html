<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Joost Klein</title>

  <style>
    @font-face {
      font-family: 'Terminal';
      src: url('https://imgekkefries.pythonanywhere.com/terminal.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.84);
      --text-muted: rgba(255, 255, 255, 0.5);
      --line: rgba(255, 255, 255, 0.2);
      --font: 'Terminal', "Sohne-var", "Helvetica Neue", Arial, sans-serif;
      --pad: clamp(24px, 4.5vw, 72px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #000;
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 22px;
      height: 22px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .video-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      background: #000;
      transform: scale(1.04) translate3d(0, 0, 0);
      transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      will-change: transform;
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      background: #000;
      filter: brightness(0.7);
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.12) 55%, rgba(0, 0, 0, 0) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.28) 100%);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(140, 140, 140, 0.12) 0px,
        rgba(140, 140, 140, 0.12) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      display: none;
      color: #fff;
    }

    .error-message.visible { display: block; }

    .error-message h1 {
      font-size: clamp(24px, 3.5vw, 40px);
      font-weight: 400;
      margin-bottom: 8px;
    }

    .error-message p {
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--text-muted);
    }

    .page {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(32px, 6vh, 64px);
      padding: var(--pad);
      overflow-y: auto;
      pointer-events: none;
    }

    .page > * { pointer-events: auto; }

    .reveal {
      opacity: 0;
      transition: opacity 1.1s ease;
      transition-delay: calc(var(--i, 0) * 140ms + 150ms);
    }

    body.ready .reveal { opacity: 1; }

    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px 32px;
    }

    .header-title {
      font-size: clamp(48px, 8.5vw, 132px);
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 0.95;
      display: block;
      cursor: default;
      user-select: none;
      width: fit-content;
    }

    .info {
      display: flex;
      flex-direction: column;
      width: min(100%, 640px);
    }

    .info-row {
      display: grid;
      grid-template-columns: clamp(110px, 12vw, 170px) 1fr;
      align-items: baseline;
      gap: 16px;
      padding: clamp(12px, 1.8vh, 18px) 0;
      border-top: 1px solid var(--line);
    }

    .info-row:last-child { border-bottom: 1px solid var(--line); }

    .section-label {
      font-size: clamp(14px, 1.15vw, 17px);
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .section-items {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.2vh, 12px);
    }

    .section-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(17px, 1.7vw, 24px);
      font-weight: 400;
      line-height: 1.2;
      color: var(--text-soft);
    }

    .icon {
      width: 1.05em;
      height: 1.05em;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: var(--text-muted);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .section-item:hover .icon { color: var(--text); }

    .social-link {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-soft);
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      transition: color 0.25s ease;
    }

    .social-link .arrow {
      width: 0.8em;
      height: 0.8em;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.45;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      color: var(--text);
      outline: none;
    }

    .social-link:hover .arrow,
    .social-link:focus-visible .arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .social-link:hover .copy-ic,
    .social-link:focus-visible .copy-ic {
      transform: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: clamp(24px, 5vh, 48px);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      color: #000;
      border-radius: 999px;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1;
      letter-spacing: 0.01em;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #000;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 750px) {
      .info-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .section-label { font-size: 13px; }
      .section-item  { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .video-container { transform: none; transition: none; }
      .reveal { transition-duration: 0.01s; transition-delay: 0s; }
      .toast { transition: none; }
      .loading-spinner { animation-duration: 2s; }
    }
  </style>
</head>

        hls.stopLoad();
      }
    });

    window.addEventListener('focus', () => {
      if (isPageVisible) {
        playVideo();
        if (hls && hls.media) {
          hls.startLoad();
        }
      }
    });

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            shouldBePlaying = true;
            if (isPageVisible) {
              playVideo();
            }
          } else {
            shouldBePlaying = false;
            pauseVideo();
          }
        });
      }, {
        threshold: 0.1
      });

      observer.observe(videoElement);
    }

    window.addEventListener('load', function() {
      setTimeout(loadVideo, 500);
    });
  })();

  window.addEventListener('load', function() {
    initHoverEffects();
  });
</script>

</body>
</html>
