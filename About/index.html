<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Joost Klein</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #000000;
      font-family: 'Terminal', "Sohne-var", "Helvetica Neue", Arial, sans-serif;
      color: #e8e8e8;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    @font-face {
      font-family: 'Terminal';
      src: url('https://imgekkefries.pythonanywhere.com/terminal.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0c0f15;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #5E6AD2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      background: #000000;
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      background: #000;
      filter: brightness(0.65);
    }

    video::-webkit-media-controls {
      display: none !important;
    }
    
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 2;
      pointer-events: none;
    }

    .error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      display: none;
      color: white;
    }

    .error-message.visible {
      display: block;
    }

    .error-message h1 {
      font-size: clamp(32px, 5vw, 64px);
      margin-bottom: 10px;
    }

    .error-message p {
      font-size: clamp(18px, 2.5vw, 32px);
      color: #8d8d8d;
    }

    .header-container {
      z-index: 3;
      display: flex;
      justify-content: flex-start;
      gap: 3px;
      width: 100%;
      max-width: 1728px;
      margin: auto;
      padding: 2% 2%;
      position: fixed;
      top: 3%;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      pointer-events: none;
      max-height: 90vh;
      overflow-y: auto;
    }

    .header-content {
      display: inline-flex;
      flex-direction: column;
      gap: 0;
      pointer-events: auto;
    }

    .header-title {
      font-family: 'Terminal', 'Sohne-mono', monospace;
      font-size: clamp(56px, 9vw, 140px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      display: block;
      cursor: default;
      user-select: none;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .info-section {
      margin-top: clamp(20px, 3vh, 40px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.5vh, 18px);
    }

    .section-label {
      font-family: 'Terminal', 'Sohne-mono', monospace;
      font-size: clamp(28px, 3.5vw, 46px);
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      opacity: 0.9;
    }

    .section-items {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.2vh, 14px);
    }

    .section-item {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vw, 14px);
      font-family: 'Terminal', 'Sohne-mono', monospace;
      font-size: clamp(20px, 2.5vw, 34px);
      font-weight: 400;
      color: #e8e8e8;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      opacity: 0.85;
    }

    .section-item-bullet {
      width: clamp(7px, 0.5vw, 9px);
      height: clamp(7px, 0.5vw, 9px);
      background: #ffffff;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .flag-icon {
      width: clamp(28px, 2.5vw, 36px);
      height: auto;
      border-radius: 2px;
      vertical-align: middle;
      margin-left: 5px;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
    }

    .python-icon {
      width: clamp(24px, 2vw, 30px);
      height: auto;
      vertical-align: middle;
      margin-left: 5px;
      filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    }

    .ski-icon {
      width: clamp(24px, 2vw, 30px);
      height: auto;
      vertical-align: middle;
      margin-left: 5px;
      filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    }

    .scuba-icon {
      width: clamp(24px, 2vw, 30px);
      height: auto;
      vertical-align: middle;
      margin-left: 5px;
      filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    }

    .social-link {
      font-family: 'Terminal', 'Sohne-mono', monospace;
      font-size: clamp(20px, 2.5vw, 34px);
      font-weight: 400;
      color: #e8e8e8;
      text-decoration: none;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      opacity: 0.85;
      display: inline-block;
      transition: opacity 0.2s ease, color 0.2s ease, text-shadow 0.2s ease;
      cursor: pointer;
      pointer-events: auto;
    }

    .social-link:hover {
      opacity: 1;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 750px) {
      .header-title {
        font-size: clamp(36px, 11vw, 64px);
      }
      
      .header-container {
        top: 2%;
      }
      
      .section-label {
        font-size: clamp(22px, 4.5vw, 32px);
      }
      
      .section-item,
      .social-link {
        font-size: clamp(16px, 3.5vw, 24px);
      }
      
      .flag-icon,
      .python-icon,
      .ski-icon,
      .scuba-icon {
        width: clamp(18px, 2.5vw, 24px);
      }
    }
  </style>
</head>
<body>

</div>

<div class="video-overlay"></div>

        </div>

    </div>

    <div class="info-section">
      <div class="section-label hoverchar">Hobbies:</div>
      
      <div class="section-items">
        <div class="section-item">
          <span class="section-item-bullet"></span>
          <span class="hoverchar">Skiing</span>
          <img src="https://cdn-icons-png.flaticon.com/512/94/94150.png" alt="Skiing" class="ski-icon">
        </div>
        
        <div class="section-item">
          <span class="section-item-bullet"></span>
          <span class="hoverchar">Scuba Diving</span>
          <img src="https://www.svgrepo.com/show/241907/scuba-diving-dive.svg" alt="Scuba Diving" class="scuba-icon">
        </div>
      </div>
    </div>

    <div class="info-section">
      <div class="section-label hoverchar">Socials:</div>
      
      <div class="section-items">
        <div class="section-item">
          <span class="section-item-bullet"></span>
          <a href="https://discord.com/users/1147540007171670077" target="_blank" rel="noopener" class="social-link hoverchar">Discord</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="error-message" id="errorMessage">
  <h1>Video Not Found</h1>
  <p>The JoostKlein video could not be loaded.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

<script>

  const _e = be.toLowerCase().replace(/[0-9@&#$%()[\]{}|\\/?!;*^]/g, "");
  const xe = new Map;

          m = p < f.length / 2 ? f.length - 1 : 0,
          g = f[Math.floor(H(p, m, h))];
        o[a] = g, n = !0, u >= .99 && (o[a] = s, delete e[a])
      }
      n && (t.textContent = o.join("")), 0 === Object.keys(e).length && (xe.delete(t),
        function(e) {
          for (const [t, o] of We)
            o.delete(e), 0 === o.size && (t.style.width = "", We.delete(t))
        }(t))
    }), Me = setTimeout(animateHoverEffects, 35)
  }

  function initHoverEffects() {
    clearTimeout(Me), animateHoverEffects();
    for (const e of document.querySelectorAll("a, button, .hoverchar")) {
      if (e.dataset.active || e.closest(".text p")) continue;
      e.dataset.active = "true";
      const t = parseInt(e.dataset.dy) || 0,
        o = parseInt(e.dataset.dx) || 1,

          { clientX: s, clientY: i } = a;

            } else document.caretRangeFromPoint && (c = document.caretRangeFromPoint(o, a));
            if (!c) break;
            const d = c.getClientRects();
            if (!d.length) break;
            const u = [...d][0],
              h = c.startContainer,
              f = c.startOffset;
            if (o > u.left + r * f) break;
            if (h && h.nodeType === Node.TEXT_NODE && e.contains(h) && !h.parentNode.closest(".big, .mega")) {
              const e = (h.textContent || "").split("");
              if (f >= 0 && f < e.length) {

                o.trim() && (be.includes(o.toUpperCase()) || _e.includes(o)) && startHoverEffect(h, f, Math.abs(t * l), n)

  (function() {

    }
    
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function() {

      });
    } else {
      setTimeout(hideLoading, 1000);
    }
  })();

  (function() {
    let baseurl = null;
    let hls = null;
    const videoElement = document.getElementById('backgroundVideo');
    const errorMessage = document.getElementById('errorMessage');
    let isPageVisible = !document.hidden;
    let shouldBePlaying = true;

    async function fetchBaseUrl() {
      try {
        const response = await fetch(VpsURL);
        if (response.ok) {
          baseurl = await response.text();
          baseurl = baseurl.trim();
          return baseurl;
        }
      } catch (e) {}
      return null;
    }

    function getMasterPlaylistUrl() {
      if (!baseurl) return null;
      return `${baseurl}/video/JoostKlein/master.m3u8`;
    }

    function showError() {
      errorMessage.classList.add('visible');
      videoElement.style.display = 'none';
      const loadingScreen = document.getElementById('loadingScreen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(function() { loadingScreen.remove(); }, 500);
      }
    }

    function playVideo() {
      if (isPageVisible && shouldBePlaying) {
        videoElement.play().catch((err) => {
          videoElement.muted = true;
          videoElement.play().catch(() => {});
        });
      }
    }

    function pauseVideo() {
      videoElement.pause();
    }

    async function loadVideo() {
      if (!baseurl) await fetchBaseUrl();
      if (!baseurl) {
        showError();
        return;
      }

      const videoUrl = getMasterPlaylistUrl();
      if (!videoUrl) {
        showError();
        return;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,

          maxBufferHole: 0.5,

        hls.loadSource(videoUrl);
        hls.attachMedia(videoElement);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          playVideo();
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:

                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:

        videoElement.src = videoUrl;
        videoElement.addEventListener('loadedmetadata', () => {
          playVideo();

        videoElement.addEventListener('error', (e) => {

        });
      } else {
        showError();
      }
    }

    document.addEventListener('visibilitychange', () => {

      if (isPageVisible) {
        playVideo();
        if (hls && hls.media) {
          hls.startLoad();
        }
      } else {
        pauseVideo();
        if (hls && hls.media) {
          hls.stopLoad();
        }
      }
    });

    window.addEventListener('blur', () => {
      pauseVideo();
      if (hls && hls.media) {
        hls.stopLoad();
      }
    });

    window.addEventListener('focus', () => {
      if (isPageVisible) {
        playVideo();
        if (hls && hls.media) {

            }

            shouldBePlaying = false;
            pauseVideo();
          }

      }, {
        threshold: 0.1

      observer.observe(videoElement);
    }

    window.addEventListener('load', function() {
